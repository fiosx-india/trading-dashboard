<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Trading Dashboard</title>
    <style>
        /* டிவி மற்றும் மொபைல் திரைக்கு ஏற்ற வடிவமைப்பு */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0f14; /* டிரேடிங்கிற்கு ஏற்ற டார்க் பேக்கிரவுண்ட் */
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* திரையை சரியாக கிரிட் அமைப்பாகப் பிரிக்கும் முறை (3 பத்திகள், 2 வரிசைகள்) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
            height: 100%;
            padding: 6px;
        }
        /* ஒவ்வொரு ஆப் பாக்ஸின் வடிவமைப்பு */
        .app-box {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 6px;
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* ஆப்களின் பக்கங்கள் முழுமையாக உள்ளே தெரிய */
        .app-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* ஆப்களின் தலைப்புப் பெயர் */
        .app-title {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #58a6ff; /* நீல நிற ஹைலைட் */
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        
        <!-- ஆப் 1: v0 Indian Indicator -->
        <div class="app-box">
            <div class="app-title">1. v0 Indian Indicator</div>
            <iframe src="https://v0.app/sharvikaenterprises2015-8236/indian-indicator"></iframe>
        </div>

        <!-- ஆப் 2: Emergent Chat -->
        <div class="app-box">
            <div class="app-title">2. Emergent Chat</div>
            <iframe src="https://app.emergent.sh/chat"></iframe>
        </div>

        <!-- ஆப் 3: Lovable Project -->
        <div class="app-box">
            <div class="app-title">3. Lovable Project</div>
            <iframe src="https://lovable.dev/projects/fa629ed0-5706-4bdd-b812-6a8b869da08a"></iframe>
        </div>

        <!-- ஆப் 4: Bolt Indian Stock Market -->
        <div class="app-box">
            <div class="app-title">4. Bolt Indian Stock Market</div>
            <iframe src="https://indian-stock-market-ajqc.bolt.host/"></iframe>
        </div>

        <!-- ஆப் 5: Streamlit Angel One Connection -->
        <div class="app-box">
            <div class="app-title">5. Streamlit Angel One</div>
            <iframe src="https://appapppy-mhvfewiz92md6awyv745nj.streamlit.app/#1-angel-one-connection"></iframe>
        </div>

    </div>

</body>
</html>
