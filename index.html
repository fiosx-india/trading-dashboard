<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional TV Trading Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0f14;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* 💡 டிவியின் பெரிய திரைக்கு ஏற்ப 3 பத்திகள், 2 வரிசைகளாக கச்சிதமாகப் பிரிக்கும் லேஅவுட் */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: 8px;
        }
        /* ஒவ்வொரு ஆப் பாக்ஸும் டிவியில் நீள நீளமாகத் தெரிய வடிவமைப்பு */
        .app-box {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 6px;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* 💡 புதிய வசதி: ஆப்களை 60% ஆகச் சுருக்கி (Zoom Out), டிவி திரையின் நீளத்திற்கு ஏற்ப அலைன்மென்ட் செய்தல் */
        .app-box iframe {
            width: 166.66%; /* 100% / 0.60 */
            height: 166.66%;
            transform: scale(0.60); /* எழுத்துக்கள் மற்றும் சார்ட்டுகளை இன்னும் சிறியதாக்குகிறது */
            transform-origin: top left;
            border: none;
        }
        /* ஆப்களின் தலைப்புப் பெயர் */
        .app-title {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #58a6ff;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        
        <!-- ஆப் 1: Angel One Live Data -->
        <div class="app-box">
            <div class="app-title">1. Angel One Connection</div>
            <iframe src="https://streamlit.app"></iframe>
        </div>

        <!-- ஆப் 2: Trend Oracle Signals -->
        <div class="app-box">
            <div class="app-title">2. Trend Oracle Signals</div>
            <iframe src="https://lovable.app"></iframe>
        </div>

        <!-- ஆப் 3: Alpha Quantum Pro -->
        <div class="app-box">
            <div class="app-title">3. Alpha Quantum Pro</div>
            <iframe src="https://streamlit.app"></iframe>
        </div>

        <!-- ஆப் 4: Market Pulse -->
        <div class="app-box">
            <div class="app-title">4. Market Pulse</div>
            <iframe src="https://streamlit.app"></iframe>
        </div>

        <!-- ஆப் 5: Emergent Chat -->
        <div class="app-box">
            <div class="app-title">5. Emergent Chat</div>
            <iframe src="https://emergent.sh"></iframe>
        </div>

        <!-- ஆப் 6: Application Development -->
        <div class="app-box">
            <div class="app-title">6. Application Development</div>
            <iframe src="https://bolt.host"></iframe>
        </div>

    </div>

</body>
</html>
