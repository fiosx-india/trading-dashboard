<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Market Multi-View Dashboard</title>
    <style>
        /* டிவி திரைக்கு ஏற்றவாறு முழுப் பக்கத்தையும் அமைத்தல் */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212; /* கண்கள் வலிக்காமல் இருக்க டார்க் மோடு */
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* திரையை 6 பாகங்களாகப் பிரிக்கும் கிரிட் லேஅவுட் (3 பத்திகள், 2 வரிசைகள்) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px; /* பாக்ஸ்களுக்கு இடையே உள்ள இடைவெளி */
            width: 100%;
            height: 100%;
            padding: 4px;
        }
        /* ஒவ்வொரு சேனல் பாக்ஸின் வடிவமைப்பு */
        .channel-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* பாக்ஸின் உள்ளே லிங்க் பக்கங்கள் முழுமையாகத் தெரிய */
        .channel-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* சேனல் பெயர் தலைப்பு */
        .channel-title {
            position: absolute;
            top: 3px;
            left: 3px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 3px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        
        <!-- சேனல் 1: Angel One Connection (Streamlit) -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 1 (Angel One)</div>
            <iframe src="https://appapppy-mhvfewiz92md6awyv745nj.streamlit.app/?embed=true#1-angel-one-connection"></iframe>
        </div>

        <!-- சேனல் 2: Lovable FNO -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 2 (Lovable FNO)</div>
            <iframe src="https://trend-oracle-now.lovable.app/fno"></iframe>
        </div>

        <!-- சேனல் 3: Trendpulse (Streamlit) -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 3 (Trendpulse)</div>
            <iframe src="https://trendpulse-alpha-dztmhwavm8f4var6svoh8r.streamlit.app/?embed=true"></iframe>
        </div>

        <!-- சேனல் 4: Indian Commodity (Bolt) -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 4 (Indian Commodity)</div>
            <iframe src="https://indian-commodity-pre-563n.bolt.host/"></iframe>
        </div>

        <!-- சேனல் 5: கூடுதல் ஆப் அல்லது சார்ட் சேர்க்க -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 5</div>
            <iframe src="https://tradingview.com"></iframe>
        </div>

        <!-- சேனல் 6: கூடுதல் ஆப் அல்லது சார்ட் சேர்க்க -->
        <div class="channel-box">
            <div class="channel-title">சேனல் 6</div>
            <iframe src="https://google.com"></iframe>
        </div>

    </div>

</body>
</html>
