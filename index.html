<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Trading Dashboard</title>
    
    <!-- JS Proxy மாட்யூல்களை இணைக்கவும் (Iframe லாக்கை உடைக்க) -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com" type="module"></script>
    
    <style>
        /* உங்கள் டார்க் தீம் கிரிட் ஸ்டைல் */
        body { background-color: #0d1117; color: white; font-family: sans-serif; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        .card { border: 1px solid #30363d; background: #161b22; border-radius: 8px; padding: 10px; min-height: 400px; }
        iframe { width: 100%; height: 350px; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- 1. v0 Indian Indicator -->
        <div class="card">
            <h3>1. v0 Indian Indicator</h3>
            <!-- சாதாரண iframe-க்கு பதிலாக is="x-frame-bypass" சேர்க்கவும் -->
            <iframe is="x-frame-bypass" src="YOUR_V0_APP_URL"></iframe>
        </div>

        <!-- 2. Emergent Chat -->
        <div class="card">
            <h3>2. Emergent Chat</h3>
            <iframe is="x-frame-bypass" src="YOUR_EMERGENT_CHAT_URL"></iframe>
        </div>

        <!-- 3. Lovable Project -->
        <div class="card">
            <h3>3. Lovable Project</h3>
            <iframe is="x-frame-bypass" src="YOUR_LOVABLE_PROJECT_URL"></iframe>
        </div>

        <!-- 4. Bolt Indian Stock Market -->
        <div class="card">
            <h3>4. Bolt Indian Stock Market</h3>
            <iframe src="YOUR_BOLT_URL"></iframe>
        </div>

        <!-- 5. Streamlit Angel One -->
        <div class="card">
            <h3>5. Streamlit Angel One</h3>
            <!-- Streamlit லாக்கையும் இது பைபாஸ் செய்யும் -->
            <iframe is="x-frame-bypass" src="YOUR_STREAMLIT_APP_URL"></iframe>
        </div>

        <!-- 6. Master Dashboard -->
        <div class="card">
            <h3>6. Master Dashboard</h3>
            <iframe src="YOUR_DASHBOARD_DATA_URL"></iframe>
        </div>
    </div>

</body>
</html>
